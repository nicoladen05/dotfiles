add_newline = false
format = "$directory$git_branch$git_status$nix_shell$hostname$character"

[directory]
fish_style_pwd_dir_length = 1
truncation_length = 0
read_only = " 󰌾"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "

[git_status]
format = "([$all_status$ahead_behind]($style) )"

[nix_shell]
symbol = " "
format = "[$symbol]($style) "

[hostname]
ssh_only = true
ssh_symbol = " "
format = "[$ssh_symbol$hostname]($style) "

