# Prefix: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Prefer fish for new panes and windows, falling back to bash when unavailable.
run-shell 'tmux set-option -g default-shell "$(command -v fish || command -v bash)"'

# Unicode/colour support for Nerd Font prompts/icons inside tmux.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',*:RGB'
set -gq status-utf8 on
setw -gq utf8 on

# Minimal bottom status bar
set -g status on
set -g status-position bottom
set -g status-style 'bg=default,fg=colour244'
set -g status-left ' #S '
set -g status-left-length 30
set -g status-right ' %H:%M '
set -g status-right-length 10
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W* '
set -g window-status-current-style 'fg=white'

# Start window and pane numbering at 1; close panes immediately.
set -g base-index 1
setw -g pane-base-index 1
bind x kill-pane

# Enable clicking panes/windows, resizing borders, and wheel scrolling.
set -g mouse on
